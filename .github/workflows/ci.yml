name: CI

# Runs on every PR (B125). Kept fast on purpose — the full, high-repetition
# concurrency check lives in nightly.yml instead, so this pipeline stays
# something people actually wait for rather than learn to ignore.
on:
  pull_request:
  push:
    branches: [master]

env:
  HUSKY: "0"
  SUPABASE_URL: http://127.0.0.1:54321
  # The Supabase CLI's well-known, publicly-documented local development
  # default service-role key — not a secret, identical for every
  # `supabase init` project. Never used against a real deployment.
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  SESSION_COOKIE_SECRET: ci-only-32-character-minimum-secret-value

jobs:
  static:
    name: Lint, typecheck, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run format:check

  unit-integration:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
      - run: pnpm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E, accessibility
    runs-on: ubuntu-latest
    needs: unit-integration
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
      - name: Seed inventory and configuration
        run: |
          pnpm run seed
          pnpm run seed:config
      - name: Bootstrap admin accounts
        # `bootstrap-admin.ts` deliberately never accepts a password as a
        # CLI argument (it would land in shell history/process listings)
        # — it prompts on stdin instead, piped here. It only creates the
        # first ADMIN_TELKOMSEL account; the second (ADMIN_KAMPUS) fixture
        # account is created inline the same way that script does it
        # internally, since no script creates a non-first admin in one
        # step.
        run: |
          echo "TestPassword123!" | pnpm run bootstrap-admin -- --email=admin@halo.test
          pnpm exec tsx -e "
            import { supabaseAdmin } from './src/lib/supabase-admin';
            import { sql } from './src/server/db/client';
            (async () => {
              const { data, error } = await supabaseAdmin.auth.admin.createUser({
                email: 'kampus@halo.test',
                password: 'TestPassword123!',
                email_confirm: true,
              });
              if (error || !data.user) throw error ?? new Error('user creation failed');
              await sql\`insert into admin_users (user_id, role) values (\${data.user.id}, 'ADMIN_KAMPUS')\`;
              process.exit(0);
            })();
          "
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm run test:e2e --project=mobile --project=webkit-smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
